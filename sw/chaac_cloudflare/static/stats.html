<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chaac</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css">
    <script src="/layout.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script>
      var current_plot = '/json/stats/range?days=365';

      function load_plots(url) {
        current_plot = url;
        var host = getChaacHost();
        // Update active button styling
        var btns = document.querySelectorAll('#range-selector .button');
        btns.forEach(function(b) {
          b.classList.toggle('is-link', b.dataset.range === url);
        });
        // Reset year dropdown unless this url came from it
        var yearSel = document.getElementById('year-select');
        if (yearSel && url.indexOf('year=') === -1) {
          yearSel.value = '';
        }
        fetch('/' + host + url)
        .then(function(response) {
          return response.json();
        })
        .then(function(plot) {
          populate_year_dropdown(plot.available_years || []);
          draw_plots(plot);
        });
      }

      function build_range_selector() {
        var container = document.getElementById('range-selector');
        var ranges = [
          { label: 'Last 12 months', url: '/json/stats/range?days=365' },
          { label: 'This year',      url: '/json/stats/range?year=' + new Date().getFullYear() },
          { label: 'All time',       url: '/json/stats/range' },
        ];
        ranges.forEach(function(r) {
          var btn = document.createElement('a');
          btn.className = 'button is-small';
          btn.textContent = r.label;
          btn.dataset.range = r.url;
          btn.onclick = function() { load_plots(r.url); };
          container.appendChild(btn);
        });

        // Year dropdown (populated after first fetch)
        var wrap = document.createElement('span');
        wrap.className = 'select is-small';
        var sel = document.createElement('select');
        sel.id = 'year-select';
        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Year...';
        sel.appendChild(placeholder);
        sel.onchange = function() {
          if (sel.value) load_plots('/json/stats/range?year=' + sel.value);
        };
        wrap.appendChild(sel);
        container.appendChild(wrap);
      }

      function populate_year_dropdown(years) {
        var sel = document.getElementById('year-select');
        if (!sel || sel.dataset.populated === 'true' || years.length === 0) return;
        years.slice().reverse().forEach(function(y) {
          var opt = document.createElement('option');
          opt.value = String(y);
          opt.textContent = String(y);
          sel.appendChild(opt);
        });
        sel.dataset.populated = 'true';
      }

      function draw_plots(plot) {
        var plots = [
          { title:"Temperature", xdata:"timestamp-th", ydata:"temperature",
            y_label:"Temperature (°" + localStorage.temperature_units.toUpperCase() + ")",
            div:"div-temperature", type:"scatter" },
          { title:"Pressure", xdata:"timestamp", ydata:"pressure",
            y_label:"Pressure (" + localStorage.pressure_units + ")",
            div:"div-pressure", type:"scatter" },
          { title:"Humidity", xdata:"timestamp-th", ydata:"humidity",
            y_label:"Humidity (%RH)", div:"div-humidity", type:"scatter" },
          { title:"Rain", xdata:"timestamp", ydata:"rain",
            y_label:"Rain (mm)", div:"div-rain", type:"bar" },
          { title:"Wind Speed", xdata:"timestamp", ydata:"wind_speed",
            y_label:"Speed (kph)", div:"div-wspeed", type:"scatter" },
          { title:"Battery Level", xdata:"timestamp", ydata:"battery",
            y_label:"Voltage (V)", div:"div-battery", type:"scatter" },
          { title:"Light Level", xdata:"timestamp", ydata:"light",
            y_label:"Light Level (0-1)", div:"div-light", type:"scatter" },
          { title:"Solar Panel", xdata:"timestamp", ydata:"solar_panel",
            y_label:"Voltage (V)", div:"div-solar", type:"scatter" },
        ];

        for (var [name, pd] of Object.entries(plot.devices)) {
          pd["timestamp-th"] = pd.timestamp.slice();

          // Filter bad temp/humidity reads across min/mean/max series
          for (var idx = pd.temperature.min.length - 1; idx >= 0; idx--) {
            if (pd.temperature.min[idx] < -100 || pd.humidity.min[idx] <= 1) {
              pd.temperature.min.splice(idx, 1);
              pd.temperature.mean.splice(idx, 1);
              pd.temperature.max.splice(idx, 1);
              pd.humidity.min.splice(idx, 1);
              pd.humidity.mean.splice(idx, 1);
              pd.humidity.max.splice(idx, 1);
              pd["timestamp-th"].splice(idx, 1);
            }
          }

          if (localStorage.pressure_units === "inHg" && pd.pressure) {
            for (var [, series] of Object.entries(pd.pressure)) {
              for (var x = 0; x < series.length; x++) {
                series[x] = (series[x] / 33.8638866).toFixed(3);
              }
            }
          }

          if (localStorage.temperature_units === "f" && pd.temperature) {
            for (var [, series] of Object.entries(pd.temperature)) {
              for (var x = 0; x < series.length; x++) {
                series[x] = (series[x] * (9.0/5.0) + 32).toFixed(3);
              }
            }
          }
        }

        plots.forEach(function(item) {
          var layout = {
            title: { text: item.title },
            xaxis: { title: { text: "Time" } },
            yaxis: { title: { text: item.y_label } }
          };

          var traces = [];
          for (var [name, pd] of Object.entries(plot.devices)) {
            if (pd.stat_fields.includes(item.ydata)) {
              for (var [stat, values] of Object.entries(pd[item.ydata])) {
                traces.push({
                  x: pd[item.xdata],
                  y: values,
                  type: item.type,
                  name: name + " " + stat
                });
              }
            }
            if (item.ydata === "rain" && pd.rain) {
              traces.push({
                x: pd.timestamp,
                y: pd.rain,
                type: item.type,
                name: name + " rain"
              });
            }
          }

          Plotly.purge(document.getElementById(item.div));
          Plotly.newPlot(document.getElementById(item.div), traces, layout, { responsive: true });
        });

        document.getElementById("div-header").innerHTML =
          "Weather from <b>" + plot.start_date + "</b> to <b>" + plot.end_date + "</b>";
      }

      function draw_chaac() {
        load_plots(current_plot);
      }

      window.onload = function() {
        build_range_selector();
        draw_chaac();
      };
    </script>
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="/">Chaac.network</a>
        <a role="button" class="navbar-burger burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>
      <div id="navbarMenu" class="navbar-menu"></div>
    </nav>
    <section class="section" id="settings" style="display:none">
      <div class="container">
        <article class="message is-dark">
          <div class="message-header">
            <p>Settings</p>
            <div class="field is-grouped">
              <p class="control"><a class="button is-link" id="save_settings_btn">Save</a></p>
              <p class="control"><a class="button" id="cancel_settings_btn">Cancel</a></p>
            </div>
          </div>
          <div class="message-body">
            <table class="table"><tbody>
              <tr>
                <td>Pressure Units: </td>
                <td>
                  <label class="radio"><input type="radio" name="pressure_units" id="pressure_units_hpa" value="hPa"> hPa</label>
                  <label class="radio"><input type="radio" name="pressure_units" id="pressure_units_inhg" value="inHg"> inHg</label>
                </td>
              </tr>
              <tr>
                <td>Temperature Units: </td>
                <td>
                  <label class="radio"><input type="radio" name="temperature_units" id="temperature_units_c" value="c"> C</label>
                  <label class="radio"><input type="radio" name="temperature_units" id="temperature_units_f" value="f"> F</label>
                </td>
              </tr>
            </tbody></table>
          </div>
        </article>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="columns is-desktop"><div class="column"><h3 class="subtitle is-3" id="div-header">Weather</h3></div></div>
        <div class="columns is-desktop"><div class="column"><div id="range-selector" style="display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem;"></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-temperature"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-humidity"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-pressure"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-rain"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-wspeed"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-battery"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-solar"></div></div></div></div>
        <div class="columns is-desktop"><div class="column"><div class="notification has-text-centered"><div id="div-light"></div></div></div></div>
      </div>
    </section>
  </body>
</html>
