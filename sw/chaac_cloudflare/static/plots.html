<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chaac</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css">
    <script src="/layout.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script>
      var current_plot = '/json/day';

      function load_plots(url) {
        current_plot = url;
        var host = getChaacHost();
        fetch('/' + host + current_plot)
        .then(function(response) {
          return response.json();
        })
        .then(function(data) {
          draw_plots(data);
        });
      }

      function draw_plots(data) {
        var plots = [
          { title:"Temperature", xdata:"timestamp-th", ydata:"temperature",
            y_label:"Temperature (°" + localStorage.temperature_units.toUpperCase() + ")",
            div:"div-temperature", type:"scatter" },
          { title:"Pressure", xdata:"timestamp", ydata:"pressure",
            y_label:"Pressure (" + localStorage.pressure_units + ")",
            div:"div-pressure", type:"scatter" },
          { title:"Humidity", xdata:"timestamp-th", ydata:"humidity",
            y_label:"Humidity (%RH)", div:"div-humidity", type:"scatter" },
          { title:"Rain", xdata:"rain_time", ydata:"rain",
            y_label:"Rain (mm)", div:"div-rain", type:"bar" },
          { title:"Wind Speed", xdata:"timestamp", ydata:"wind_speed",
            y_label:"Speed (kph)", div:"div-wspeed", type:"scatter" },
          { title:"Wind Direction", xdata:"timestamp", ydata:"wind_dir",
            y_label:"Direction", div:"div-wdir", type:"scatter" },
          { title:"Battery Level", xdata:"timestamp", ydata:"battery",
            y_label:"Voltage (V)", div:"div-battery", type:"scatter" },
          { title:"Solar Panel", xdata:"timestamp", ydata:"solar_panel",
            y_label:"Voltage (V)", div:"div-solar", type:"scatter" },
        ];

        for (var [name, values] of Object.entries(data.data)) {
          // Filter bad temp/humidity reads on a separate timestamp axis
          values["timestamp-th"] = values.timestamp.slice();
          for (var idx = values.temperature.length - 1; idx >= 0; idx--) {
            if (values.temperature[idx] < -100 || values.humidity[idx] <= 1) {
              values.temperature.splice(idx, 1);
              values.humidity.splice(idx, 1);
              values["timestamp-th"].splice(idx, 1);
            }
          }

          if (localStorage.pressure_units === "inHg") {
            for (var x = 0; x < values.pressure.length; x++) {
              values.pressure[x] = (values.pressure[x] / 33.8638866).toFixed(3);
            }
          }

          if (localStorage.temperature_units === "f") {
            for (var x = 0; x < values.temperature.length; x++) {
              values.temperature[x] = (values.temperature[x] * (9.0/5.0) + 32).toFixed(3);
            }
          }
        }

        plots.forEach(function(item) {
          var layout = {
            title: { text: item.title },
            xaxis: { title: { text: "Time" } },
            yaxis: { title: { text: item.y_label } }
          };

          var traces = [];
          for (var [name, values] of Object.entries(data.data)) {
            traces.push({
              x: values[item.xdata],
              y: values[item.ydata],
              type: item.type,
              name: name
            });
          }

          Plotly.purge(document.getElementById(item.div));
          Plotly.newPlot(document.getElementById(item.div), traces, layout, { responsive: true });
        });

        document.getElementById("div-header").innerHTML =
          "Weather from <b>" + data.start_date + "</b> to <b>" + data.end_date + "</b>";
      }

      function draw_chaac() {
        load_plots(current_plot);
      }

      window.onload = function() {
        draw_chaac();
      };
    </script>
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="/">Chaac.network</a>
        <a role="button" class="navbar-burger burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>
      <div id="navbarMenu" class="navbar-menu"></div>
    </nav>
    <section class="section" id="settings" style="display:none">
      <div class="container">
        <article class="message is-dark">
          <div class="message-header">
            <p>Settings</p>
            <div class="field is-grouped">
              <p class="control"><a class="button is-link" id="save_settings_btn">Save</a></p>
              <p class="control"><a class="button" id="cancel_settings_btn">Cancel</a></p>
            </div>
          </div>
          <div class="message-body">
            <table class="table"><tbody>
              <tr>
                <td>Pressure Units: </td>
                <td>
                  <label class="radio"><input type="radio" name="pressure_units" id="pressure_units_hpa" value="hPa"> hPa</label>
                  <label class="radio"><input type="radio" name="pressure_units" id="pressure_units_inhg" value="inHg"> inHg</label>
                </td>
              </tr>
              <tr>
                <td>Temperature Units: </td>
                <td>
                  <label class="radio"><input type="radio" name="temperature_units" id="temperature_units_c" value="c"> C</label>
                  <label class="radio"><input type="radio" name="temperature_units" id="temperature_units_f" value="f"> F</label>
                </td>
              </tr>
            </tbody></table>
          </div>
        </article>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="columns">
          <div class="column">
            <button class="button" onclick="load_plots('/json/day')">Day</button>
            <button class="button" onclick="load_plots('/json/week')">Week</button>
            <button class="button" onclick="load_plots('/json/month')">Month</button>
          </div>
        </div>
        <div class="columns is-desktop">
          <div class="column">
            <h3 class="subtitle is-3" id="div-header">Weather</h3>
          </div>
        </div>
        <div class="columns is-desktop">
          <div class="column"><div class="notification has-text-centered"><div id="div-temperature"></div></div></div>
          <div class="column"><div class="notification has-text-centered"><div id="div-humidity"></div></div></div>
        </div>
        <div class="columns is-desktop">
          <div class="column"><div class="notification has-text-centered"><div id="div-pressure"></div></div></div>
          <div class="column"><div class="notification has-text-centered"><div id="div-rain"></div></div></div>
        </div>
        <div class="columns is-desktop">
          <div class="column"><div class="notification has-text-centered"><div id="div-wspeed"></div></div></div>
          <div class="column"><div class="notification has-text-centered"><div id="div-wdir"></div></div></div>
        </div>
        <div class="columns is-desktop">
          <div class="column"><div class="notification has-text-centered"><div id="div-battery"></div></div></div>
          <div class="column"><div class="notification has-text-centered"><div id="div-solar"></div></div></div>
        </div>
      </div>
    </section>
  </body>
</html>
