<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chaac</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.7.2/css/bulma.min.css">
    <script src="/layout.js"></script>
    <script type="text/javascript">
      var first_load = true;

      var wind_dir_str = [
        "N", "NNE", "NE", "ENE",
        "E", "ESE", "SE", "SSE",
        "S", "SSW", "SW", "WSW",
        "W", "WNW", "NW", "NNW"];

      // Per-uid cached values so unit toggles can re-render without re-fetching
      var cached_pressure = {};
      var cached_temperature = {};

      function load_latest() {
        var host = getChaacHost();
        fetch('/' + host + '/latest')
        .then(function(response) {
          return response.json();
        })
        .then(function(latest) {
          if (first_load) {
            first_load = false;
            create(latest.devices);
          }
          update_fields(latest.devices);
        });
      }

      function makeItemTitle(uid, name) {
        var title_h = document.createElement("h3");
        title_h.className = "subtitle is-3 has-text-centered";
        title_h.innerHTML = `${name} @ <b id="${uid}_timestamp"></b>`;

        var col = document.createElement("div");
        col.className = "column";
        col.appendChild(title_h);

        var cols = document.createElement("div");
        cols.className = "columns is-desktop";
        cols.appendChild(col);
        return cols;
      }

      function makeDataField(uid, fieldName) {
        var title = document.createElement("h2");
        title.className = "title is-2";
        title.innerHTML = fieldName;

        var value = document.createElement("h3");
        value.className = "subtitle is-3";
        value.id = `${uid}_` + fieldName.toLowerCase().replace(/ /g, "_");
        value.innerHTML = "...";

        var notification = document.createElement("div");
        notification.className = "notification has-text-centered";
        notification.appendChild(title);
        notification.appendChild(value);

        var col = document.createElement("div");
        col.className = "column";
        col.appendChild(notification);
        return col;
      }

      function makeDataFields(uid, name) {
        var container = document.createElement("div");
        container.className = "container";
        container.appendChild(makeItemTitle(uid, name));

        var cols = document.createElement("div");
        cols.className = "columns is-desktop";
        cols.appendChild(makeDataField(uid, "Temperature"));
        cols.appendChild(makeDataField(uid, "Humidity"));
        cols.appendChild(makeDataField(uid, "Pressure"));
        container.appendChild(cols);

        cols = document.createElement("div");
        cols.className = "columns is-desktop";
        cols.appendChild(makeDataField(uid, "Battery"));
        cols.appendChild(makeDataField(uid, "Rain"));
        cols.appendChild(makeDataField(uid, "Wind"));
        container.appendChild(cols);

        cols = document.createElement("div");
        cols.className = "columns is-desktop";
        cols.appendChild(makeDataField(uid, "Solar Panel"));
        container.appendChild(cols);

        return container;
      }

      function create(devices) {
        var root = document.getElementById("mainthing");
        for (var [uid, values] of Object.entries(devices)) {
          root.appendChild(makeDataFields(uid, values.name));
        }
      }

      function update_fields(devices) {
        for (var [uid, values] of Object.entries(devices)) {
          document.getElementById(uid + "_timestamp").innerHTML = values.timestamp;
          document.getElementById(uid + "_humidity").innerHTML = values.humidity + "%";
          document.getElementById(uid + "_battery").innerHTML = values.battery + " V";
          document.getElementById(uid + "_rain").innerHTML = values.rain + " mm";
          document.getElementById(uid + "_wind").innerHTML =
            wind_dir_str[Math.trunc(values.wind_dir * 16 / 360)] + " @ " + values.wind_speed + " kph";
          document.getElementById(uid + "_solar_panel").innerHTML = values.solar_panel + " V";
          show_pressure(uid, values.pressure);
          show_temperature(uid, values.temperature);
        }
      }

      function show_pressure(uid, pressure) {
        if (typeof pressure !== "undefined") {
          cached_pressure[uid] = pressure;
        }
        var p = cached_pressure[uid];
        var converted_pressure, unit_str;
        switch (localStorage.pressure_units) {
          case "inHg":
            converted_pressure = (p / 33.8638866).toFixed(2);
            unit_str = "inHg";
            break;
          case "hPa":
          default:
            converted_pressure = p;
            unit_str = "hPa";
            break;
        }
        document.getElementById(uid + "_pressure").innerHTML = converted_pressure + " " + unit_str;
      }

      function show_temperature(uid, temperature) {
        if (typeof temperature !== "undefined") {
          cached_temperature[uid] = temperature;
        }
        var t = cached_temperature[uid];
        var converted_temperature, unit_str;
        switch (localStorage.temperature_units) {
          case "f":
            converted_temperature = (t * (9.0 / 5.0) + 32).toFixed(2);
            unit_str = "F";
            break;
          case "c":
          default:
            converted_temperature = t;
            unit_str = "C";
            break;
        }
        document.getElementById(uid + "_temperature").innerHTML = converted_temperature + " °" + unit_str;
      }

      // Called by layout.js when settings change
      function draw_chaac() {
        for (var uid of Object.keys(cached_temperature)) {
          show_temperature(uid);
        }
        for (var uid of Object.keys(cached_pressure)) {
          show_pressure(uid);
        }
      }

      window.onload = function() {
        load_latest();
      };
    </script>
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item" href="/">Chaac.network</a>
        <a role="button" class="navbar-burger burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>
      <div id="navbarMenu" class="navbar-menu"></div>
    </nav>
    <section class="section" id="settings" style="display:none">
      <div class="container">
        <article class="message is-dark">
          <div class="message-header">
            <p>Settings</p>
            <div class="field is-grouped">
              <p class="control"><a class="button is-link" id="save_settings_btn">Save</a></p>
              <p class="control"><a class="button" id="cancel_settings_btn">Cancel</a></p>
            </div>
          </div>
          <div class="message-body">
            <table class="table"><tbody>
              <tr>
                <td>Pressure Units: </td>
                <td>
                  <label class="radio"><input type="radio" name="pressure_units" id="pressure_units_hpa" value="hPa"> hPa</label>
                  <label class="radio"><input type="radio" name="pressure_units" id="pressure_units_inhg" value="inHg"> inHg</label>
                </td>
              </tr>
              <tr>
                <td>Temperature Units: </td>
                <td>
                  <label class="radio"><input type="radio" name="temperature_units" id="temperature_units_c" value="c"> C</label>
                  <label class="radio"><input type="radio" name="temperature_units" id="temperature_units_f" value="f"> F</label>
                </td>
              </tr>
            </tbody></table>
          </div>
        </article>
      </div>
    </section>
    <section class="section">
      <div id="mainthing"></div>
    </section>
  </body>
</html>
